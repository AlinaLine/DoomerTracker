<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DoomerTracker</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  
    <style id="boot-style">
      #boot {
        position: fixed; inset: 0; z-index: 99;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0B0A14; color: #EDEAF7;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #boot .boot-emoji { font-size: 46px; }
      #boot .boot-title { font-size: 22px; font-weight: 800; margin-top: 8px; letter-spacing: .5px; }
      #boot .boot-hint { color: #8E88B0; font-size: 13px; margin-top: 10px; text-align: center; padding: 0 24px; max-width: 420px; line-height: 1.5; }
      #boot .boot-dot { animation: bootPulse 1s infinite alternate; }
      #boot .boot-dot:nth-child(2) { animation-delay: .2s; }
      #boot .boot-dot:nth-child(3) { animation-delay: .4s; }
      @keyframes bootPulse { from { opacity: .25 } to { opacity: 1 } }
      #boot.hide { transition: opacity .25s; opacity: 0; }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <div id="boot" role="status">
      <div class="boot-emoji">🪦</div>
      <div class="boot-title">DoomerTracker</div>
      <div class="boot-hint" id="bootHint">загружаюсь<span class="boot-dot">.</span><span class="boot-dot">.</span><span class="boot-dot">.</span></div>
    </div>
    <script id="boot-hide">
      (function () {
        var boot = document.getElementById('boot');
        var hint = document.getElementById('bootHint');
        if (!boot || !hint) return;

        var problem = false;
        function reportProblem() {
          if (problem) return;
          problem = true;
          hint.textContent = 'Кажется, сайт загрузился не полностью. Обнови страницу (потяни вниз, чтобы обновить). Если не помогло — залей на хостинг всю папку dist заново.';
        }

        // ловим ошибки загрузки ДО того, как приложение запустится
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          var isScriptTag = t && String(t.tagName || '').toUpperCase() === 'SCRIPT';
          var msg = String((e && e.message) || '');
          if (isScriptTag || /unexpected token|syntaxerror|mime|chunk|not executable/i.test(msg)) reportProblem();
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var msg = String((r && r.message) || r || '');
          if (/chunk|module|script|import/i.test(msg)) reportProblem();
        });

        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(timer);
            boot.className = 'hide';
            setTimeout(function () { boot.style.display = 'none'; }, 300);
          }
          if (tries === 160 && !problem) {
            hint.textContent = 'Долго грузится. Проверь интернет и обнови страницу (потяни вниз). Если совсем никак — открой ссылку в приватном окне.';
          }
        }, 150);
      })();
    </script>

  <script src="/_expo/static/js/web/entry-f5c9a5588685f8293039f623ad35965c.js" defer></script>
</body>
</html>
